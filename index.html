<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263238">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Neuro Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f3ef;color:#263238;-webkit-tap-highlight-color:transparent}
header{background:#263238;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header button{background:none;border:0;color:#fff;font-size:15px;padding:4px 8px}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.big{font-size:34px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;text-align:center}
.stat small{display:block;color:#78909c;font-size:12px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:600;background:#00897b;color:#fff;margin-top:8px}
.btn.alt{background:#eceff1;color:#263238}
.btn.warn{background:#e53935}
.btn:disabled{opacity:.45}
.bar{height:10px;background:#eceff1;border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:#00897b}
.muted{color:#78909c;font-size:13px}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;padding:10px;border-radius:8px;border:1px solid #cfd8dc;background:#fff;font-size:16px}
.seg button.on{background:#263238;color:#fff;border-color:#263238}
#fig{position:relative;background:#fff;border-radius:12px;overflow:hidden;touch-action:manipulation}
#fig svg{display:block;width:100%;height:auto;margin:0 auto}
#fig .hint{position:absolute;right:8px;bottom:6px;font-size:11px;color:#90a4ae;background:rgba(255,255,255,.8);padding:2px 6px;border-radius:6px}
.meta{font-size:12px;color:#78909c;margin:6px 2px}
input#ans{width:100%;font-size:18px;padding:12px;border-radius:10px;border:2px solid #cfd8dc;margin-top:10px}
input#ans:focus{outline:none;border-color:#00897b}
.fb{border-radius:10px;padding:12px;margin-top:10px;font-size:16px}
.fb.ok{background:#e8f5e9;color:#1b5e20}.fb.almost{background:#fff8e1;color:#8d6e00}.fb.bad{background:#ffebee;color:#b71c1c}
.fb b{display:block;font-size:18px;margin-top:4px;color:#263238}
.two{display:flex;gap:8px}.two .btn{flex:1}
.prog{font-size:13px;color:#cfd8dc}
@keyframes pulse{0%{r:14;opacity:1}100%{r:30;opacity:0}}
.ring{fill:none;stroke:#e53935;stroke-width:4}
.ring2{fill:none;stroke:#e53935;stroke-width:3;animation:pulse 1.4s ease-out infinite}
</style>
</head>
<body>
<header><h1 id="htitle">Neuro Quiz</h1><span class="prog" id="hprog"></span><button id="hbtn" hidden>✕</button></header>
<main id="app"></main>
<script src="data.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) {
  // when a new version takes over, reload once so it shows straight away
  const had = !!navigator.serviceWorker.controller; let done = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done) { done = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
}</script>
</body>
</html>
